name: Fix portrait chunk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert missing p0 repeat
        run: |
          python3 - << 'PY'
          path = "assets/p0.txt"
          text = open(path, encoding="utf-8").read()
          old = "iIgIiICIiAonU5hGjLmaiQRx"
          new = "iIgIiICIiAiIgIiICIiAonU5hGjLmaiQRx"
          if new in text:
              print("p0 already exact")
          elif old not in text:
              raise SystemExit("anchor missing")
          else:
              text = text.replace(old, new, 1)
              open(path, "w", encoding="utf-8").write(text)
              print("p0 patched")
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/p0.txt
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Add faculty site pages"
            git push
          fi
